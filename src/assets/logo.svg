<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Document/book shape -->
  <rect x="8" y="6" width="28" height="36" rx="3" fill="url(#gradient1)" />

  <!-- Page fold -->
  <path d="M30 6 L36 12 L30 12 Z" fill="#8b7cf7" opacity="0.6"/>

  <!-- Text lines representing content -->
  <rect x="13" y="16" width="18" height="2" rx="1" fill="rgba(255,255,255,0.3)"/>
  <rect x="13" y="22" width="14" height="2" rx="1" fill="rgba(255,255,255,0.3)"/>
  <rect x="13" y="28" width="16" height="2" rx="1" fill="rgba(255,255,255,0.3)"/>

  <!-- AI sparkle accent -->
  <circle cx="38" cy="10" r="4" fill="url(#sparkle)"/>
  <circle cx="38" cy="10" r="2" fill="white"/>

  <!-- Small sparkles -->
  <circle cx="42" cy="6" r="1.5" fill="#a29bfe" opacity="0.8"/>
  <circle cx="44" cy="12" r="1" fill="#6c5ce7" opacity="0.6"/>

  <defs>
    <linearGradient id="gradient1" x1="8" y1="6" x2="36" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#4834d4"/>
    </linearGradient>
    <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a29bfe"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </radialGradient>
  </defs>
</svg>
